name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Build and run regression
        run: nix build --print-build-logs .#checks.x86_64-linux.regression

  release:
    name: Tag release
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-tags
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Tag a version change
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release-tag.py
